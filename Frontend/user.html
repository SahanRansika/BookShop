<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookshop POS - User</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

<div class="flex flex-col md:flex-row h-screen">
  <!-- Product List Section -->
  <div class="w-full md:w-3/4 p-6 overflow-y-auto">
    <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
      <h1 class="text-3xl font-bold">Bookshop</h1>
      <div class="relative w-full max-w-md">
        <input type="text" id="search" placeholder="Search books..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none"/>
        <i class="fas fa-search absolute left-3 top-3 text-gray-400 pointer-events-none"></i>
      </div>
    </div>

    <div id="categoryButtons" class="flex flex-wrap gap-3 mb-6">
      <button class="category-btn active px-4 py-2 border rounded-full hover:bg-blue-100 transition" data-category="all">All Items</button>
      <button class="category-btn px-4 py-2 border rounded-full hover:bg-blue-100 transition" data-category="novel">Novels</button>
      <button class="category-btn px-4 py-2 border rounded-full hover:bg-blue-100 transition" data-category="education">Education</button>
      <button class="category-btn px-4 py-2 border rounded-full hover:bg-blue-100 transition" data-category="stationery">Stationery</button>
    </div>

    <!-- Product Cards -->
    <div id="products" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
  </div>

  <!-- Cart / Current Order Section -->
  <aside class="w-full md:w-1/4 p-6 bg-white border-l overflow-y-auto">
    <h2 class="text-xl font-bold mb-4">Current Order</h2>
    <ul id="cartItems" class="mb-4 space-y-2"></ul>

    <div class="text-right space-y-1">
      <p>Subtotal: Rs. <span id="subtotal">0.00</span></p>
      <p>Tax (10%): Rs. <span id="tax">0.00</span></p>
      <p class="font-bold">Total: Rs. <span id="total">0.00</span></p>
    </div>

    <div class="grid grid-cols-2 gap-4 mt-6">
      <button onclick="clearCart()" class="bg-red-500 text-white py-3 px-4 rounded-lg hover:bg-red-600 transition">Clear</button>
      <button onclick="checkout()" class="bg-green-500 text-white py-3 px-4 rounded-lg hover:bg-green-600 transition">Checkout</button>
    </div>
  </aside>
</div>

<!-- Receipt Popup -->
<div id="receipt" class="hidden fixed inset-0 bg-white p-8 shadow-xl z-50 overflow-auto max-w-sm mx-auto my-10 border border-gray-300 rounded-lg"></div>

<!-- JS -->
<script type="module" src="js/user.js"></script>
</body>
</html>
