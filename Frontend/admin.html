<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Admin</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>

<body class="bg-gray-100 min-h-screen">
<div class="flex h-screen">
    <!-- Main Section -->
    <div class="w-full p-6 overflow-y-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Bookshop</h1>
            <div class="flex items-center space-x-4">
                <div class="relative flex-grow">
                    <input
                            type="text"
                            id="search"
                            placeholder="Search books..."
                            class="pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-400 focus:border-transparent w-full"
                    />
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400 pointer-events-none"></i>
                </div>
                <button
                        id="openAddBookBtn"
                        class="bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 transition flex items-center"
                >
                    <i class="fas fa-plus mr-2"></i> Add New Book
                </button>
            </div>
        </div>

        <!-- Categories -->
        <div
                class="flex space-x-4 mb-6 overflow-x-auto py-2 max-w-[900px] mx-auto"
                id="categoryButtons"
        >
            <button
                    class="category-btn active px-4 py-2 rounded-full border transition-colors"
                    data-category="all"
            >
                All Items
            </button>
            <button
                    class="category-btn px-4 py-2 rounded-full border transition-colors"
                    data-category="novel"
            >
                Novels
            </button>
            <button
                    class="category-btn px-4 py-2 rounded-full border transition-colors"
                    data-category="education"
            >
                Education
            </button>
            <button
                    class="category-btn px-4 py-2 rounded-full border transition-colors"
                    data-category="stationery"
            >
                Stationery
            </button>
        </div>

        <!-- Product Table -->
        <div class="overflow-x-auto">
            <table
                    class="min-w-full bg-white rounded-lg shadow"
                    id="bookTable"
                    role="table"
                    aria-label="Book List"
            >
                <thead>
                <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                    <th class="py-3 px-6 text-left">Id</th>
                    <th class="py-3 px-6 text-left">Image</th>
                    <th class="py-3 px-6 text-left">Title</th>
                    <th class="py-3 px-6 text-left">Category</th>
                    <th class="py-3 px-6 text-left">Qty</th>
                    <th class="py-3 px-6 text-left">Price (Rs.)</th>
                    <th class="py-3 px-6 text-left">Action</th>
                </tr>
                </thead>
                <tbody id="products" class="text-gray-600 text-sm font-light">
                <!-- JS will inject book rows here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Book Modal -->
<div
        id="addBookModal"
        class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50"
        role="dialog"
        aria-modal="true"
        aria-labelledby="addBookModalTitle"
>
    <div class="bg-white rounded-lg p-6 w-96 max-w-full">
        <h3
                id="addBookModalTitle"
                class="text-xl font-bold mb-4 text-gray-800"
        >
            Add New Book
        </h3>
        <form id="addBookForm" class="space-y-4" novalidate>
            <div>
                <label for="bookName" class="block mb-1 font-semibold">Title</label>
                <input
                        type="text"
                        id="bookName"
                        class="w-full border rounded px-3 py-2"
                        required
                />
            </div>
            <div>
                <label for="bookCategory" class="block mb-1 font-semibold"
                >Category</label
                >
                <select
                        id="bookCategory"
                        class="w-full border rounded px-3 py-2"
                        required
                >
                    <option value="" disabled selected>Select category</option>
                    <option value="novel">Novel</option>
                    <option value="education">Education</option>
                    <option value="stationery">Stationery</option>
                </select>
            </div>
            <div>
                <label for="bookQty" class="block mb-1 font-semibold">Qty</label>
                <input
                        type="number"
                        id="bookQty"
                        class="w-full border rounded px-3 py-2"
                        min="1"
                        required
                />
            </div>
            <div>
                <label for="bookPrice" class="block mb-1 font-semibold"
                >Price (Rs.)</label
                >
                <input
                        type="number"
                        id="bookPrice"
                        class="w-full border rounded px-3 py-2"
                        min="0"
                        step="0.01"
                        required
                />
            </div>
            <div>
                <label for="bookImageFile" class="block mb-1 font-semibold"
                >Upload Image</label
                >
                <input
                        type="file"
                        id="bookImageFile"
                        class="w-full border border-gray-300 p-2 rounded"
                        accept="image/*"
                />
            </div>
            <img
                    id="previewImage"
                    src="#"
                    alt="Image Preview"
                    class="hidden w-full h-40 object-cover rounded mb-3"
            />
            <div class="flex justify-end space-x-4 pt-4">
                <button
                        type="button"
                        id="cancelAddBookBtn"
                        class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400 transition"
                >
                    Cancel
                </button>
                <button
                        type="submit"
                        class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition"
                >
                    Save
                </button>
            </div>
        </form>
    </div>
</div>

<!-- JS -->
<script type="module" src="js/book.js"></script>
</body>
</html>
